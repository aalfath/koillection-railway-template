# Local test stack (not used by Railway): app at 0.5 GB / 1 CPU like Railway's Free plan,
# Postgres, and rclone's S3 server standing in for a Railway Bucket.
services:
  postgres:
    image: postgres:18.1
    environment: { POSTGRES_DB: railway, POSTGRES_USER: postgres, POSTGRES_PASSWORD: testpw-local-only }
    volumes: [ "pg:/var/lib/postgresql" ]
  s3:
    image: rclone/rclone:1.76.0@sha256:7cbeec24a44f206067597c0368be4de90ae19a64d5113c7d1938bd737a81e466
    entrypoint: [ "sh", "-c", "mkdir -p /data/koillection && exec rclone serve s3 /data --addr :9000 --auth-key testkey,testsecret-local-only" ]
    volumes: [ "s3:/data" ]
  app:
    build: ..
    mem_limit: 512m
    cpus: 1
    ports: [ "8080:8080" ]
    depends_on: [ postgres, s3 ]
    environment:
      PORT: "8080"
      APP_SECRET: local-test-secret-0123456789abcdef
      JWT_PASSPHRASE: local-test-jwt-passphrase-0123
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: local-Test-Admin-pw-123
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: railway
      DB_USER: postgres
      DB_PASSWORD: testpw-local-only
      S3_ENDPOINT: http://s3:9000
      S3_BUCKET: koillection
      S3_REGION: us-east-1
      S3_ACCESS_KEY_ID: testkey
      S3_SECRET_ACCESS_KEY: testsecret-local-only
      S3_FORCE_PATH_STYLE: "true"
      HTTPS_ENABLED: "0"
volumes: { pg: {}, s3: {} }
